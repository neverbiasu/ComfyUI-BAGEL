[project]
name = "comfyui-bagel"
description = "A ComfyUI extention for BAGEL(Unified Model for Multimodal Understanding and Generation)"
version = "1.1.0"
license = {file = "LICENSE"}
dependencies = ["decord==0.6.0", "einops==0.8.1", "huggingface_hub>=0.29.1,<1.0", "matplotlib==3.7.0", "opencv-python==4.7.0.72", "pyarrow==11.0.0", "PyYAML==6.0.2", "Requests==2.32.3", "accelerate>=0.34.0"]

# GPU-only / optional dependencies. The native BAGEL loader runs in BF16 and does
# NOT require these; they are separated so the package installs on CPU/macOS.
# NOTE: installing this generic `cuda` extra with plain `pip` may still trigger
# a source build on hosts without a matching prebuilt wheel.
[project.optional-dependencies]
cuda = ["flash_attn==2.8.3"]
quantization = ["bitsandbytes"]

[project.urls]
Repository = "https://github.com/neverbiasu/ComfyUI-BAGEL"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "faych"
DisplayName = "ComfyUI-BAGEL"
Icon = ""
